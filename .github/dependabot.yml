version: 2

# No `target-branch` anywhere on purpose: `main` is already the default branch,
# so setting it was a no-op for version updates — but it silently switched off
# Dependabot *security* updates, which only ever target the default branch
# ("you should not specify a target-branch" in the options reference). It also
# added a stray `main` segment to every branch name, which fetch-metadata then
# misreported as `directory: /main`.
#
# The groups below bundle patch+minor per ecosystem into one weekly PR; majors
# stay separate for individual review. On 2026-07-26 the grouping did not take
# effect (14 individual PRs, `dependency-group` empty in every metadata set)
# even though the run was the scheduled one and none of them were security
# updates. `applies-to` is now explicit; whether that was the cause will only
# show on the next wave of bumps.

updates:
  # Check for updates to Python packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"
    assignees:
      - "dodjango"
    reviewers:
      - "dodjango"
    versioning-strategy: "auto"
    # Bundle all patch/minor bumps into one weekly PR (auto-merged).
    # Major bumps stay separate so they can be reviewed individually.
    groups:
      pip-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Check for updates to GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "github-actions"
      include: "scope"
    assignees:
      - "dodjango"
    reviewers:
      - "dodjango"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
    assignees:
      - "dodjango"
    reviewers:
      - "dodjango"
    versioning-strategy: "auto"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
