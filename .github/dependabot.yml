version: 2

# No `target-branch` anywhere on purpose: `main` is already the default branch,
# so setting it was a no-op for version updates — but it silently switched off
# Dependabot *security* updates, which only ever target the default branch
# ("you should not specify a target-branch" in the options reference). It also
# added a stray `main` segment to every branch name, which fetch-metadata then
# misreported as `directory: /main`.
#
# The groups below bundle patch+minor per ecosystem into one weekly PR; majors
# stay separate for individual review.
#
# They never took effect, and the reason was not the group syntax: this file
# had been schema-invalid since the very commit that introduced the groups
# (2026-07-22), because `versioning-strategy` is not allowed for the docker
# ecosystem. Dependabot reported that on its `.github/dependabot.yml` check —
# a check that only re-runs when this file changes, so nobody saw it for days
# while the scheduled runs quietly fell back to one PR per dependency.
#
# Lesson: after editing this file, look at the `.github/dependabot.yml` check
# on the commit. A silently ignored config looks exactly like a working one.

updates:
  # Check for updates to Python packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"
    assignees:
      - "dodjango"
    reviewers:
      - "dodjango"
    versioning-strategy: "auto"
    # Bundle all patch/minor bumps into one weekly PR (auto-merged).
    # Major bumps stay separate so they can be reviewed individually.
    groups:
      pip-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Check for updates to GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "github-actions"
      include: "scope"
    assignees:
      - "dodjango"
    reviewers:
      - "dodjango"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
    assignees:
      - "dodjango"
    reviewers:
      - "dodjango"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
